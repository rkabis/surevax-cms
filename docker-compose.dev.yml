services:
  db:
    image: postgres:15-alpine
    container_name: surevax-dev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: surevax_dev
      POSTGRES_USER: surevax
      POSTGRES_PASSWORD: surevax_dev_password
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U surevax -d surevax_dev']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
